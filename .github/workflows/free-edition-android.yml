name: Android free-edition build check

on:
  workflow_dispatch:
  push:
    branches:
      - feature/free-edition
  pull_request:
    paths:
      - 'budget/**'
      - '.github/workflows/free-edition-android.yml'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        working-directory: budget
        run: flutter pub get
      - name: Build Android debug APK
        working-directory: budget
        run: flutter build apk --debug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cashew-free-edition-debug
          path: budget/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
