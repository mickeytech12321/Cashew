name: Android free-edition build check

on:
  workflow_dispatch:
  push:
    branches:
      - feature/free-edition
  pull_request:
    paths:
      - 'budget/**'
      - '.github/workflows/free-edition-android.yml'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Use Java 17 for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Toolchain versions
        run: |
          java -version
          flutter --version
      - name: Resolve dependencies
        working-directory: budget
        run: flutter pub get
      - name: Audit resolved Android plugin compatibility
        working-directory: budget
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          root = Path.cwd()
          deps = json.loads((root / '.dart_tool' / 'package_config.json').read_text())['packages']
          plugins = []
          legacy = []
          for dep in deps:
              uri = dep['rootUri']
              if not uri.startswith('file:'):
                  continue
              from urllib.parse import urlparse, unquote
              folder = Path(unquote(urlparse(uri).path))
              if not (folder / 'android').is_dir():
                  continue
              plugins.append(dep['name'])
              for source in (folder / 'android' / 'src').rglob('*') if (folder / 'android' / 'src').exists() else []:
                  if source.suffix not in ('.java', '.kt'):
                      continue
                  content = source.read_text(errors='replace')
                  if 'PluginRegistry.Registrar' in content or re.search(r'\\bRegistrar\\b', content):
                      legacy.append(f'{dep["name"]}: {source.relative_to(folder)}')
          print('Resolved Android plugins:', len(plugins))
          print('\\n'.join(sorted(plugins)))
          print('Legacy Registrar references:', len(legacy))
          print('\\n'.join(sorted(legacy)))
          if any(name.startswith('in_app_purchase') for name in plugins):
              raise SystemExit('Free edition must not include billing plugins')
          PY
      - name: Add namespaces to legacy Android Flutter plugins
        working-directory: budget
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          cache = pathlib.Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          for gradle in cache.glob("*/android/build.gradle"):
              content = gradle.read_text()
              if re.search(r'\bnamespace\b', content):
                  continue
              manifest = gradle.parent / "src" / "main" / "AndroidManifest.xml"
              namespace = None
              if manifest.exists():
                  try:
                      namespace = ET.parse(manifest).getroot().attrib.get("package")
                  except ET.ParseError:
                      pass
              if not namespace:
                  name = gradle.parent.parent.name.rsplit("-", 1)[0].replace("-", "_")
                  namespace = "dev.cashew.legacy." + re.sub(r"[^a-zA-Z0-9_]", "_", name)
              if not re.fullmatch(r"[a-zA-Z_][a-zA-Z0-9_]*(?:\.[a-zA-Z_][a-zA-Z0-9_]*)+", namespace):
                  raise ValueError(f"Invalid namespace {namespace} for {gradle}")
              gradle.write_text(content + '\nandroid { namespace "' + namespace + '" }\n')
              print(f"Added namespace {namespace} to {gradle.parent.parent.name}")
          PY
      - name: Patch legacy value_layout_builder for Flutter layout callback API
        working-directory: budget
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          files = list(cache.glob("value_layout_builder-*/lib/src/value_layout_builder.dart"))
          files += list(cache.glob("value_layout_builder-*/lib/src/sliver_value_layout_builder.dart"))
          if not files:
              raise RuntimeError("value_layout_builder source not found")
          for path in files:
              source = path.read_text()
              patched = source.replace("rebuildIfNecessary();", "runLayoutCallback();")
              patched, count = re.subn(
                  r"(RenderObjectWithChildMixin<[^>]+>\s*,)",
                  r"\1 RenderObjectWithLayoutCallbackMixin,",
                  patched,
              )
              if count == 0:
                  raise RuntimeError(f"No RenderObjectWithChildMixin declaration matched in {path}")
              if patched == source:
                  raise RuntimeError(f"No compatibility changes applied to {path}")
              path.write_text(patched)
              print(f"Patched {path}: mixins={count}")
          PY
      - name: Fix Kotlin Android plugin declarations in resolved dependencies
        working-directory: budget
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cache = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          patched = []
          for path in sorted(cache.glob('*/android/build.gradle.kts')):
              source = path.read_text()
              if 'kotlin {' not in source:
                  continue
              if 'org.jetbrains.kotlin.android' in source or 'kotlin("android")' in source:
                  continue
              if 'plugins {' not in source:
                  raise SystemExit(f'Kotlin extension without plugins block: {path}')
              source = source.replace('plugins {', 'plugins {' + chr(10) + '    id("org.jetbrains.kotlin.android")', 1)
              path.write_text(source)
              patched.append(str(path))
          print('Patched Kotlin Android plugin declarations:', len(patched))
          if not any('quick_actions_android-' in name for name in patched):
              raise SystemExit('Expected quick_actions_android patch missing; check plugin detection')
          for path in patched:
              print(path)
          PY
      - name: Build Android debug APK
        working-directory: budget
        run: flutter build apk --debug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cashew-free-edition-debug
          path: budget/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
