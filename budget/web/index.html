<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CashU">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f5ef">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#111816">

  <title>CashU</title>
  <link rel="manifest" href="manifest.json">

  <meta name="title" content="CashU" />
  <meta name="description" content="A budget and financial tracking application designed for you" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="CashU" />
  <meta property="og:description" content="A budget and financial tracking application designed for you" />

  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="CashU" />
  <meta property="twitter:description" content="A budget and financial tracking application designed for you" />

</head>
<body oncontextmenu="return false;">
  <script src="sql-wasm.js" defer></script>
  <div id="loading">
    <style>
      body {
        background-color: #f2f5ef;
        inset: 0;
        overflow: hidden;
        margin: 0;
        padding: 0;
        position: fixed;
      }

      @media (prefers-color-scheme: dark) {
        body { background-color: #111816; }
      }

      #loading {
        align-items: center;
        display: flex;
        height: 100%;
        justify-content: center;
        width: 100%;
      }

      .loading-spinner {
        margin: 40px 10px;
        display: inline-block;
        width: 45px;
        height: 45px;
        border: 4px solid rgba(255,255,255,.3);
        border-radius: 50%;
        border-top-color: #609574;
        animation: spin 1s linear infinite;
        opacity: .66;
      }

      .column{
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .loading-icon{
        margin: 40px 10px;
        width: min(20vh, 32vw, 140px);
        height: auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <div class="column">
      <img src="./icons/Icon.png" class="loading-icon"/>
      <div class="loading-spinner"></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
