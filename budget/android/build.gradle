allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// Keep AndroidX Glance compatible with AGP 8.9.2 / compileSdk 35.
// Newer alpha versions require AGP 9.1 and compileSdk 37.
subprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.glance') {
                details.useVersion '1.1.1'
                details.because 'Avoid Glance 1.3 alpha AAR metadata requiring Android SDK 37'
            }
        }
    }
}


// The charset detector Android plugin compiles Kotlin for JVM 17 but leaves
// Java at JVM 8. Kotlin 2.x rejects mixed targets. Align this library's Java
// target with Kotlin without patching downloaded pub-cache source files.
subprojects { subproject ->
    if (subproject.name in ['flutter_charset_detector_android', 'home_widget']) {
        subproject.plugins.withId('com.android.library') {
            subproject.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
}
