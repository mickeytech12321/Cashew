allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// Keep AndroidX Glance compatible with AGP 8.9.2 / compileSdk 35.
// Newer alpha versions require AGP 9.1 and compileSdk 37.
subprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.glance') {
                details.useVersion '1.1.1'
                details.because 'Avoid Glance 1.3 alpha AAR metadata requiring Android SDK 37'
            }
        }
    }
}
